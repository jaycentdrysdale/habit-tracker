<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf2e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c150f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Streakly" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Streakly</title>
    <meta name="description" content="A calm, simple habit tracker. Tick off your daily habits, keep your streaks going and see your week at a glance." />
    <style>
      /* Boot screen: shown until the app and its fonts are ready (inlined so it paints instantly) */
      html, body { margin: 0; background: #f8efe3; }
      @media (prefers-color-scheme: dark) { html, body { background: #17120e; } }
      .boot {
        position: fixed; inset: 0;
        display: grid; place-content: center; justify-items: center; gap: 14px;
        font: 600 15px/1 system-ui, sans-serif; color: #6d5f50;
      }
      @media (prefers-color-scheme: dark) { .boot { color: #b5a593; } }
      .boot__mark {
        width: 52px; height: 52px; border-radius: 16px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #ffa04a, #f26b35 45%, #ec4f7c);
        box-shadow: 0 12px 28px -12px #f26b35;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      .boot__mark svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.92); opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { .boot__mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Streakly">
        <span class="boot__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 12.5l3.5 3.5 7.5-8" /></svg></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
